<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARGET FOOD</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f1f5f9;padding:12px}
  .wrap{max-width:1280px;margin:auto}
  h1{font-size:24px;margin:0;text-align:center}
  #status{text-align:center;color:#64748b;font-size:12px;margin:6px 0 0}

  /* 3 KOTAK ATAS - KECIL, TANPA NOMOR */
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .card{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
  .card small{color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .card .val{font-size:15px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card input{width:100%;padding:7px 8px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-weight:700;margin-top:4px}

  /* BOX TANGGAL - CUMA TOMBOL SHOW/HIDE */
  .box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
  .box-head{display:flex;justify-content:flex-end;align-items:center}
  .toggle-btn{background:#0f172a;color:#fff;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
  .dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dates label{display:flex;gap:5px;background:#f8fafc;border:1px solid #e2e8f0;padding:6px 9px;border-radius:999px;font-size:12px;cursor:pointer;align-items:center}
  .dates label.active{background:#2563eb;color:#fff;border-color:#2563eb}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btns button{border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}

  /* TABEL - TULISAN KECIL + KOLOM PERTAMA FREEZE */
  .table-wrap{overflow:auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);max-height:75vh}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
  th,td{padding:7px 8px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap;font-size:11px}
  th{background:#0f172a;color:#fff;font-size:11px;position:sticky;top:0;z-index:3}
  /* Freeze kolom pertama */
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2;min-width:160px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  th:first-child{z-index:4;background:#0f172a}
  td:first-child{background:#fff;font-weight:600}
  tr.total td{background:#fef9c3;font-weight:800}
  tr.total td:first-child{background:#fef9c3}
  @media(max-width:700px){
    .cards{grid-template-columns:1fr 1fr 1fr;gap:6px}
    .card{padding:8px 9px}
    .card .val{font-size:13px}
    .card input{font-size:13px;padding:6px}
    h1{font-size:22px}
    th:first-child,td:first-child{min-width:130px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>TARGET FOOD</h1>
  <p id="status">Menghubungkan ke Google Sheet lo...</p>

  <div class="cards">
    <div class="card"><small>OMSET LY</small><div class="val" id="lyVal">Loading...</div></div>
    <div class="card"><small>UP TARGET</small><input type="number" id="upTarget" value="10" min="0" step="0.1" oninput="hitung()"></div>
    <div class="card"><small>TARGET</small><div class="val" id="targetVal">Loading...</div></div>
  </div>

  <div class="box">
    <div class="box-head">
      <button class="toggle-btn" id="toggleBtn" onclick="toggleTanggal()">👁️ Show Tanggal</button>
    </div>
    <div id="dateArea" style="display:none">
      <div class="dates" id="dateList"></div>
      <div class="btns">
        <button onclick="pilihSemua()" style="background:#0f172a;color:#fff">Pilih Semua (1-31)</button>
        <button onclick="hapusSemua()" style="background:#e2e8f0">Hapus Semua</button>
        <button onclick="pilih123()" style="background:#e2e8f0">Pilih 1,2,3 Saja</button>
        <button onclick="loadData()" style="background:#16a34a;color:#fff">🔄 Refresh Data</button>
      </div>
    </div>
  </div>

  <div class="table-wrap"><table><thead><tr id="headRow"><th>KATEGORI</th></tr></thead><tbody id="bodyRow"></tbody></table></div>
  <p style="font-size:11px;color:#64748b;text-align:center">Sumber: Google Sheet MASTER TARGET - Publish to web</p>
</div>

<script>
const PUB_ID = "2PACX-1vTpzRDynmPCu-45xxUm--KXetDnU3DE3Dvb3nv2A4plqHPPItNWO9bjIvzcTyPuifcMIbDWOWGreb2t";
const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=0&single=true&output=csv`;
let DATA = [];
let TOTAL_PER_TGL = [];
let AH24 = 0;
let selected = new Set([1,2,3]);
const fmt = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const toNum = v => {
  if(v==null) return 0;
  if(typeof v === "number") return v;
  let s = String(v).trim().replace(/[^0-9.\-]/g,"");
  return parseFloat(s) || 0;
};
function parseCSV(text){
  const rows=[]; let row=[], val="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"' && n==='"'){ val+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else val+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(val); val=""; }
      else if(c==='\n'){ row.push(val); rows.push(row); row=[]; val=""; }
      else if(c!=='\r') val+=c;
    }
  }
  if(val!==""||row.length) { row.push(val); rows.push(row); }
  return rows;
}
async function loadData(){
  document.getElementById("status").textContent = "Mengambil data dari Google Sheet...";
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const rows = parseCSV(text);
    let totalIdx = rows.findIndex(r => r.join(" ").toUpperCase().includes("TOTAL ALL"));
    if(totalIdx===-1) totalIdx = rows.length-1;
    DATA = [];
    for(let r=0; r<totalIdx; r++){
      const nama = (rows[r][1]||"").trim();
      if(!nama) continue;
      if(nama.toUpperCase().includes("KATEGORI") || nama.toUpperCase().includes("CATEGORY")) continue;
      if(!isNaN(parseInt(nama)) && nama.length<=2) continue;
      const arr=[];
      for(let c=2;c<=32;c++) arr.push(toNum(rows[r][c]));
      if(arr.some(v=>v!==0) || nama) DATA.push([nama, arr]);
    }
    TOTAL_PER_TGL = [];
    for(let c=2;c<=32;c++) TOTAL_PER_TGL.push(toNum(rows[totalIdx][c]));
    AH24 = toNum(rows[totalIdx][33]);
    if(!AH24) AH24 = TOTAL_PER_TGL.reduce((a,b)=>a+b,0);
    document.getElementById("status").textContent = "✅ Terhubung! AH24 = " + fmt(AH24);
    renderDates(); hitung();
  }catch(e){
    document.getElementById("status").textContent = "❌ Gagal ambil data: " + e.message;
  }
}
function renderDates(){
  const el=document.getElementById("dateList"); el.innerHTML="";
  for(let d=1;d<=31;d++){
    const lab=document.createElement("label");
    if(selected.has(d)) lab.classList.add("active");
    lab.innerHTML=`<input type="checkbox" ${selected.has(d)?"checked":""} onchange="toggleDate(${d},this)"> ${d}`;
    el.appendChild(lab);
  }
}
function toggleDate(d,cb){ if(cb.checked) selected.add(d); else selected.delete(d); cb.parentElement.classList.toggle("active",cb.checked); hitung(); }
function pilihSemua(){ selected=new Set(Array.from({length:31},(_,i)=>i+1)); renderDates(); hitung(); }
function hapusSemua(){ selected=new Set(); renderDates(); hitung(); }
function pilih123(){ selected=new Set([1,2,3]); renderDates(); hitung(); }
let tanggalVisible = false;
function toggleTanggal(){
  tanggalVisible = !tanggalVisible;
  document.getElementById("dateArea").style.display = tanggalVisible ? "block" : "none";
  document.getElementById("toggleBtn").textContent = tanggalVisible ? "👁️ Hide Tanggal" : "👁️ Show Tanggal";
}
function hitung(){
  if(!TOTAL_PER_TGL.length) return;
  const up=parseFloat(document.getElementById("upTarget").value)||0;
  const tgls=[...selected].sort((a,b)=>a-b);
  let ly=0; tgls.forEach(d=> ly+=TOTAL_PER_TGL[d-1]||0);
  const target=ly*(1+up/100);
  document.getElementById("lyVal").textContent=fmt(ly);
  document.getElementById("targetVal").textContent=fmt(target);
  const head=document.getElementById("headRow");
  head.innerHTML="<th>KATEGORI</th>";
  tgls.forEach(d=> head.innerHTML+=`<th>${d}</th>`);
  head.innerHTML+=`<th>TOTAL LY</th><th>TARGET</th>`;
  const body=document.getElementById("bodyRow"); body.innerHTML="";
  DATA.forEach(([nama,arr])=>{
    let sum=0; tgls.forEach(d=> sum+=arr[d-1]||0);
    const tgt=sum*(1+up/100);
    let row=`<tr><td>${nama}</td>`;
    tgls.forEach(d=> row+=`<td>${(arr[d-1]||0).toLocaleString("id-ID")}</td>`);
    row+=`<td><b>${sum.toLocaleString("id-ID")}</b></td><td><b>${Math.round(tgt).toLocaleString("id-ID")}</b></td></tr>`;
    body.innerHTML+=row;
  });
  let rowTotal=`<tr class="total"><td>TOTAL ALL CATEGORY</td>`;
  tgls.forEach(d=> rowTotal+=`<td>${(TOTAL_PER_TGL[d-1]||0).toLocaleString("id-ID")}</td>`);
  rowTotal+=`<td>${ly.toLocaleString("id-ID")}</td><td>${Math.round(target).toLocaleString("id-ID")}</td></tr>`;
  body.innerHTML+=rowTotal;
  body.innerHTML+=`<tr><td>AH24 - TOTAL SEBULAN (1-31)</td><td colspan="${tgls.length}" style="text-align:center">Full sebulan</td><td>${AH24.toLocaleString("id-ID")}</td><td>${Math.round(AH24*(1+up/100)).toLocaleString("id-ID")}</td></tr>`;
}
loadData();
</script>
</body>
</html>
