<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARGET FOOD</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#111}
  header{background:#111827;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50}
  header h1{margin:0;font-size:20px;letter-spacing:1px}
  header p{margin:4px 0 0;font-size:12px;opacity:.8}
  .wrap{padding:14px;max-width:1400px;margin:auto}
  .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .row label{font-size:13px;font-weight:bold}
  input[type=number]{padding:8px;border:1px solid #ccc;border-radius:8px;width:110px}
  button{padding:9px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
  .btn-dark{background:#111827;color:#fff}
  .btn-green{background:#16a34a;color:#fff}
  .btn-red{background:#dc2626;color:#fff}
  .btn-grey{background:#e5e7eb}
  #tglBox{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #tglBox label{background:#eef2ff;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #c7d2fe}
  #tglBox label.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
  #tglBox input{display:none}
  .tableWrap{overflow:auto;max-height:75vh;border:1px solid #ddd;border-radius:10px;background:#fff}
  table{border-collapse:separate;border-spacing:0;min-width:900px;width:max-content}
  th,td{padding:9px 12px;border-bottom:1px solid #eee;border-right:1px solid #eee;font-size:13px;white-space:nowrap;text-align:right}
  th{position:sticky;top:0;background:#111827;color:#fff;z-index:5}
  td:first-child,th:first-child{text-align:left;font-weight:bold}
  /* === FREEZE 3 KOLOM === */
  /* 1. KATEGORI nempel di KIRI */
  th.col-kat, td.col-kat{
    position:sticky; left:0; z-index:6;
    background:#fff; min-width:170px; max-width:170px;
  }
  th.col-kat{ background:#111827; z-index:20; }
  td.col-kat{ background:#f9fafb; box-shadow:2px 0 0 #ddd; }
  /* 2. TOTAL LY + TARGET nempel di KANAN */
  /* TARGET paling kanan */
  th.col-target, td.col-target{
    position:sticky; right:0; z-index:6;
    background:#fef3c7; min-width:120px;
    box-shadow:-2px 0 0 #ddd;
  }
  th.col-target{ background:#b45309; z-index:20; }
  /* TOTAL LY di sebelah kiri TARGET */
  th.col-totly, td.col-totly{
    position:sticky; right:120px; z-index:6;
    background:#e0e7ff; min-width:120px;
    box-shadow:-2px 0 0 #ddd;
  }
  th.col-totly{ background:#3730a3; z-index:20; }
  /* Baris total */
  tr.total td{background:#fef9c3 !important;font-weight:bold}
  .muted{font-size:12px;color:#666}
  .ok{color:#16a34a;font-weight:bold}
  .bad{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>TARGET FOOD</h1>
  <p>Dashboard TARGET FOOD - Data tersimpan otomatis di browser ini</p>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <label>Upload CSV:</label>
      <input type="file" id="fileInput" accept=".csv">
      <button class="btn-green" onclick="downloadContoh()">Download Contoh CSV</button>
      <button class="btn-red" onclick="resetSemua()">Reset</button>
      <span class="muted" id="status">Memuat data...</span>
    </div>
    <div class="row" style="margin-top:12px">
      <label>UP Target:</label>
      <input type="number" id="upInput" value="10" step="0.1" onchange="saveUp();render()">
      <span class="muted">% &nbsp;|&nbsp; Total AH 24: <b id="ah24Txt">-</b></span>
    </div>
    <div style="margin-top:12px">
      <b style="font-size:13px">Pilih Tanggal:</b>
      <button class="btn-grey" style="margin-left:8px" onclick="pilihSemua()">Pilih Semua</button>
      <button class="btn-grey" onclick="hapusSemua()">Hapus Semua</button>
      <div id="tglBox"></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>Tabel TARGET FOOD</b>
      <span class="muted">Scroll ke samping -> KATEGORI (kiri) & TOTAL LY + TARGET (kanan) tetep keliatan</span>
    </div>
    <div class="tableWrap" style="margin-top:10px">
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>
    <p class="muted" id="ketBawah"></p>
  </div>
</div>

<script>
let DATA = {}; // { kategori: { tgl: {ly, target, act} } }
let SELECTED = [];
let UP = 10;
let TOTAL_AH24 = 0;

// --- LOAD ---
try{
  let s = localStorage.getItem("tf_selected"); if(s) SELECTED = JSON.parse(s);
  let u = localStorage.getItem("tf_up"); if(u) UP = parseFloat(u);
  let d = localStorage.getItem("tf_data"); if(d) DATA = JSON.parse(d);
  let a = localStorage.getItem("tf_ah24"); if(a) TOTAL_AH24 = parseFloat(a);
}catch(e){}

if(SELECTED.length===0) SELECTED = [1,2,3];
document.getElementById("upInput").value = UP;

function saveAll(){
  try{
    localStorage.setItem("tf_selected", JSON.stringify(SELECTED));
    localStorage.setItem("tf_up", String(UP));
    localStorage.setItem("tf_data", JSON.stringify(DATA));
    localStorage.setItem("tf_ah24", String(TOTAL_AH24));
    localStorage.setItem("tf_time", new Date().toISOString());
  }catch(e){}
}
function saveUp(){ UP = parseFloat(document.getElementById("upInput").value)||0; saveAll(); }

// --- RESET YANG AMAN: cuma hapus tf_ , link lain di github.io aman ---
function resetSemua(){
  if(!confirm("Reset data TARGET FOOD aja? Tanggal & UP Target ikut ke-reset, tapi link lain GAK akan ikut ke-reset.")) return;
  try{
    let keys=[];
    for(let i=0;i<localStorage.length;i++){ keys.push(localStorage.key(i)); }
    keys.forEach(function(k){ if(k && k.indexOf("tf_")===0) localStorage.removeItem(k); });
  }catch(e){}
  location.reload();
}

function pilihSemua(){ SELECTED=[]; for(let i=1;i<=31;i++) SELECTED.push(i); saveAll(); render(); }
function hapusSemua(){ SELECTED=[]; saveAll(); render(); }
function toggleTgl(t){
  t=parseInt(t);
  if(SELECTED.includes(t)) SELECTED = SELECTED.filter(x=>x!==t);
  else SELECTED.push(t);
  SELECTED.sort((a,b)=>a-b);
  saveAll(); render();
}

function fmt(n){ if(n==null||isNaN(n)) return "-"; return Math.round(n).toLocaleString("id-ID"); }

// --- CSV ---
document.getElementById("fileInput").addEventListener("change", function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=function(){
    try{ parseCSV(r.result); document.getElementById("status").textContent="Data berhasil dimuat!"; }
    catch(err){ alert("Gagal baca CSV: "+err.message); }
  };
  r.readAsText(f);
});

function parseCSV(text){
  let lines=text.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(lines.length<2) throw new Error("CSV kosong");
  // Format contoh: Kategori,Tanggal,LY,ACT,AH24
  // atau: Kategori,1_LY,1_ACT,2_LY,2_ACT...
  let header=lines[0].split(",").map(s=>s.trim().toLowerCase());
  DATA={}; TOTAL_AH24=0;
  // Coba format sederhana dulu: Kategori,Tanggal,LY,ACT
  if(header.includes("tanggal")||header.includes("tgl")){
    for(let i=1;i<lines.length;i++){
      let c=lines[i].split(",");
      let kat=(c[0]||"").trim(); if(!kat) continue;
      let tgl=parseInt(c[1]); let ly=parseFloat(c[2])||0; let act=parseFloat(c[3])||0; let ah=parseFloat(c[4])||0;
      if(!DATA[kat]) DATA[kat]={};
      DATA[kat][tgl]={ly:ly, act:act};
      TOTAL_AH24+=ah;
    }
  } else {
    // Format lebar: Kategori,1,2,3... isinya LY, baris berikutnya TARGET dll - fallback: anggap angka = LY
    for(let i=1;i<lines.length;i++){
      let c=lines[i].split(",");
      let kat=(c[0]||"").trim(); if(!kat) continue;
      if(!DATA[kat]) DATA[kat]={};
      for(let t=1;t<=31;t++){ let v=parseFloat(c[t])||0; if(v) DATA[kat][t]={ly:v, act:0}; }
    }
  }
  saveAll(); render();
}

function downloadContoh(){
  let csv="Kategori,Tanggal,LY,ACT,AH24\nSAVORY,1,100,110,50\nSAVORY,2,120,130,60\nSWEET,1,80,90,40\n";
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="contoh-target-food.csv"; a.click();
}

// --- RENDER ---
function render(){
  document.getElementById("ah24Txt").textContent = fmt(TOTAL_AH24);
  // Kotak tanggal
  let box=document.getElementById("tglBox"); box.innerHTML="";
  for(let i=1;i<=31;i++){
    let lab=document.createElement("label");
    if(SELECTED.includes(i)) lab.className="on";
    lab.innerHTML=`<input type="checkbox" ${SELECTED.includes(i)?"checked":""} onchange="toggleTgl(${i})"> ${i}`;
    box.appendChild(lab);
  }

  let thead=document.querySelector("#tbl thead");
  let tbody=document.querySelector("#tbl tbody");
  if(Object.keys(DATA).length===0){
    thead.innerHTML=""; tbody.innerHTML="<tr><td>Belum ada data. Upload CSV dulu.</td></tr>";
    document.getElementById("status").textContent="Belum ada data - Upload CSV dulu";
    document.getElementById("ketBawah").textContent="";
    return;
  }
  document.getElementById("status").textContent="Data dimuat: "+Object.keys(DATA).length+" kategori";

  // Header: KATEGORI | [tgl-tgl dipilih] | TOTAL LY | TARGET
  let h="<tr><th class='col-kat'>KATEGORI</th>";
  SELECTED.forEach(t=>{ h+=`<th>${t}</th>`; });
  h+="<th class='col-totly'>TOTAL LY</th><th class='col-target'>TARGET</th></tr>";
  thead.innerHTML=h;

  let body=""; let grandLY=0, grandTarget=0;
  Object.keys(DATA).forEach(kat=>{
    let totLY=0, totTarget=0;
    let row=`<tr><td class='col-kat'>${kat}</td>`;
    SELECTED.forEach(t=>{
      let d=(DATA[kat]&&DATA[kat][t])?DATA[kat][t]:{ly:0,act:0};
      let target = d.ly * (1 + UP/100);
      totLY+=d.ly; totTarget+=target;
      row+=`<td>${fmt(d.act)}<br><span class='muted' style='font-size:11px'>LY ${fmt(d.ly)}</span></td>`;
    });
    grandLY+=totLY; grandTarget+=totTarget;
    row+=`<td class='col-totly'>${fmt(totLY)}</td><td class='col-target'>${fmt(totTarget)}</td></tr>`;
    body+=row;
  });
  // Baris TOTAL
  let totRow=`<tr class='total'><td class='col-kat'>TOTAL</td>`;
  SELECTED.forEach(t=>{
    let sumAct=0, sumLY=0;
    Object.keys(DATA).forEach(kat=>{ let d=(DATA[kat]&&DATA[kat][t])?DATA[kat][t]:{ly:0,act:0}; sumAct+=d.act; sumLY+=d.ly; });
    totRow+=`<td>${fmt(sumAct)}<br><span class='muted' style='font-size:11px'>LY ${fmt(sumLY)}</span></td>`;
  });
  totRow+=`<td class='col-totly'>${fmt(grandLY)}</td><td class='col-target'>${fmt(grandTarget)}</td></tr>`;
  tbody.innerHTML=body+totRow;
  document.getElementById("ketBawah").textContent="Rumus TARGET = LY + "+UP+"% (UP Target). TOTAL LY = jumlah LY di tanggal yang dipilih.";
}
render();
</script>
</body>
</html>
